[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-vega"
version = "1.0.1"
description = "Vega Guitar Controller"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["pygame==2.6.1"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "mido>=1.3,<2"]
midi = ["mido>=1.3,<2"]
rtmidi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
packaging = ["PyInstaller>=6.16,<7"]

[project.scripts]
vega-inspect-titan = "vega.diagnostics.inspect_titan:main"
vega-inspect-gestures = "vega.diagnostics.inspect_gestures:main"
vega = "vega.app.__main__:main"
edmond = "edmond.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vega.app" = ["resources/*.ico", "resources/*.svg"]
"edmond" = ["resources/*.ico", "resources/*.xmm"]
